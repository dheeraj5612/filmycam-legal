<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmy Camera - Legal</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --accent: #f5d742;
            --muted: #888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .logo { font-size: 4rem; margin-bottom: 1rem; }
        h1 { color: var(--accent); margin-bottom: 2rem; font-size: 2.5rem; }
        .links { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
        a {
            color: var(--text);
            text-decoration: none;
            padding: 1rem 2rem;
            border: 1px solid var(--accent);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        a:hover {
            background: var(--accent);
            color: var(--bg);
        }
        .footer {
            margin-top: 3rem;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="logo">📷</div>
    <h1>Filmy Camera</h1>
    <div class="links">
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-service.html">Terms of Service</a>
    </div>
    <p class="footer">&copy; 2026 Filmy Camera. All rights reserved.</p>
</body>
</html>
